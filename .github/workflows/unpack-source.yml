name: Unpack uploaded source

on:
  push:
    paths:
      - '.source/**'
      - '.github/workflows/unpack-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for all chunks
        id: chunks
        shell: bash
        run: |
          required=(.source/chunk00.b64 .source/chunk01.b64 .source/chunk02.b64 .source/chunk03.b64)
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Unpack project
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          cat .source/chunk*.b64 | base64 -d > /tmp/source.zip
          rm -rf /tmp/unpacked
          mkdir -p /tmp/unpacked
          unzip -q /tmp/source.zip -d /tmp/unpacked
          cp -a /tmp/unpacked/comfyui-simple-editor/. ./
          rm -rf .source
          rm -f app/workflow_original.json
          mkdir -p app/data/results
          touch app/data/results/.gitkeep
      - name: Commit extracted project
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import ComfyUI editor application"
          git push
