name: Apply editor source update

on:
  push:
    paths:
      - '.update/READY'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and apply tested source
        shell: bash
        run: |
          set -euo pipefail
          cat .update/payload.part* > /tmp/editor-update.b64
          base64 --decode /tmp/editor-update.b64 > /tmp/editor-update.tar.gz
          tar -xzf /tmp/editor-update.tar.gz -C .
          rm -rf .update
          rm -f .github/workflows/apply-editor-update.yml

      - name: Commit applied update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add persistent job recovery and result history"
          git push
